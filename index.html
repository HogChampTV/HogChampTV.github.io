<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --hover: #fafafa;
    --accent: #6366f1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101014;
      --card: #1b1b21;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #2b2b33;
      --hover: #232329;
      --accent: #818cf8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101014;
    --card: #1b1b21;
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --border: #2b2b33;
    --hover: #232329;
    --accent: #818cf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  main {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--border);
    object-fit: cover;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .bio {
    color: var(--muted);
    margin: 0 0 20px;
    text-align: center;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .links a {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.98rem;
    transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  }
  .links a:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    background: var(--hover);
  }
  .links a:active { transform: translateY(0); }
  .links svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    fill: currentColor;
  }
  .links img {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    object-fit: contain;
    image-rendering: pixelated;
  }
  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  footer a { color: var(--muted); }
  footer .privacy {
    display: block;
    margin-top: 6px;
    font-size: 0.72rem;
    opacity: 0.8;
  }
</style>
